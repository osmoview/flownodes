id: saveevent
name: Save Event

label:
  en: Create Event
  ru: Создать Событие

node: saveevent
lang: go

group: results

# ports
input:
  - type: frame
    name: frame
  - type: objects
    name: objects
  - type: text
    name: status
output:

form:
  - name: dir
    label:
      en: Directory
      ru: Директория
    help:
      en: The path to the directory where to save the event images
      ru: Путь до директории куда сохранять изображения событий
    default: 'data/events'

  - name: timeout
    type: number
    label:
      en: Timeout
      ru: Таймаут
    help:
      en: Timeout between events
      ru: Таймаут между сохранением событий
    default: 10

run:
  file: saveevent.go
  target: SaveEvent
  init: Init
  run: Run
  gopath: ./gopath
