id: saveevent
name: Save Event
icon: database

label:
  en: Create Event
  ru: Создать Событие

lang: go

access: internal

group: results

# ports
input:
  - type: frame
    name: frame
  - type: objects
    name: objects
  - type: regions
    name: regions
  - type: lines
    name: lines
  - type: string
    name: status
  - type: string
    name: state
output:
  - type: event
    name: event

form:
  - name: timeout
    type: number
    label:
      en: Timeout
      ru: Таймаут
    help:
      en: Timeout between events
      ru: Таймаут между сохранением событий
    default: 10

  - name: level
    type: select
    options:
      - value: -1
        label: debug
      - value: 0
        label: default
      - value: 1
        label: notice
      - value: 2
        label: important
    default: 0
    label:
      en: Level
      ru: Уровень
    help:
      en: 'Event level: debug, default, notice or important'
      ru: 'Уровень события: отладка, важный ит.д.'

  - name: group
    label:
      en: Group
      ru: Группа
    help:
      en: Some name of group to grouping events
      ru: Наименование группы для группировки ивентов

  - name: alert
    type: checkbox
    label:
      en: Alert
      ru: Оповещение

run:
  file: saveevent.go
  target: SaveEvent
  init: Init
  run: Run
  gopath: ./gopath
