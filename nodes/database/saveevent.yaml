id: saveevent
name: Save Event
icon: database

label:
  en: Create Event
  ru: Создать Событие

lang: go

access: internal

group: results

# ports
input:
  - type: frame
    name: frame
  - type: objects
    name: objects
  - type: string
    name: status
  - type: string
    name: state
output:
  - type: event
    name: event

form:
  - name: dir
    label:
      en: Directory
      ru: Директория
    help:
      en: The path to the directory where to save the event images
      ru: Путь до директории куда сохранять изображения событий
    default: 'data/events'

  - name: timeout
    type: number
    label:
      en: Timeout
      ru: Таймаут
    help:
      en: Timeout between events
      ru: Таймаут между сохранением событий
    default: 10

  - name: group
    label:
      en: Group
      ru: Группа
    help:
      en: Some name of group to grouping events
      ru: Наименование группы для группировки ивентов

  - name: alert
    type: checkbox
    label:
      en: Alert
      ru: Оповещение

run:
  file: saveevent.go
  target: SaveEvent
  init: Init
  run: Run
  gopath: ./gopath
