id: saveevent
name: Save Event
lang: go
access: internal
label:
  en: Create Event
  ru: Создать Событие
group: results
# ports
input:
  - name: frame
    type: frame
  - name: objects
    type: objects
  - name: regions
    type: regions
  - name: lines
    type: lines
  - name: status
    type: string
  - name: state
    type: string
  - name: '*'
    type: map
output:
  - name: event
    type: event
run:
  file: saveevent.go
  init: Init
  run: Run
  target: SaveEvent
form:
  - name: timeout
    type: number
    default: 10
    label:
      en: Timeout
      ru: Таймаут
    help:
      en: Timeout between events
      ru: Таймаут между сохранением событий
  - name: level
    type: select
    default: 0
    label:
      en: Level
      ru: Уровень
    help:
      en: "Event level: debug, default, notice or important"
      ru: "Уровень события: отладка, важный ит.д."
    options:
      - label: debug
        value: -1
      - label: default
        value: 0
      - label: notice
        value: 1
      - label: important
        value: 2
  - name: group
    label:
      en: Group
      ru: Группа
    help:
      en: Some name of group to grouping events
      ru: Наименование группы для группировки ивентов
  - name: alert
    type: checkbox
    label:
      en: Alert
      ru: Оповещение
icon: database
